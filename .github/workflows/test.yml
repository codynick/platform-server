name: Multi-user checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh
      - run: find upstream/components/ide -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install on disposable x86 Ubuntu VM
        run: |
          sudo mkdir -p /opt/codynick-multi/releases/test
          sudo cp -a . /opt/codynick-multi/releases/test/
          sudo python3 /opt/codynick-multi/releases/test/tools/ci_accounts.py
          sudo python3 -u /opt/codynick-multi/releases/test/install.py install
      - run: sudo python3 tests/vm_acceptance.py
      - name: Verify same-version upgrade preserves designs
        run: |
          sudo python3 -u /opt/codynick-multi/releases/test/install.py install
          sudo python3 tests/vm_acceptance.py
      - name: Failure diagnostics
        if: failure()
        run: |
          sudo systemctl status codynick-multi-alice codynick-multi-bob apache2 --no-pager -l || true
          sudo journalctl -u codynick-multi-alice -u codynick-multi-bob -n 100 --no-pager || true
          sudo tail -n 80 /var/log/apache2/codynick-multi-*.log || true
